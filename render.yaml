services:
  - type: web
    name: clipgenius-backend
    runtime: node
    rootDir: backend
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: PORT
        value: 8080
      - key: MAX_UPLOAD_MB
        value: 500
      - key: MIN_CLIP_SECONDS
        value: 15
      - key: MAX_CLIP_SECONDS
        value: 90
      - key: DEFAULT_CLIP_SECONDS
        value: 35
      - key: CLEANUP_AFTER_MINUTES
        value: 120
      - key: RATE_LIMIT_WINDOW_MINUTES
        value: 15
      - key: RATE_LIMIT_MAX_REQUESTS
        value: 10
    disk:
      name: clipgenius-storage
      mountPath: /opt/render/project/src/backend/storage
      sizeGB: 2
