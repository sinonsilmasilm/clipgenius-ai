
services:
  - type: web
    name: clipgenius-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: MAX_UPLOAD_MB
        value: 25
      - key: MIN_CLIP_SECONDS
        value: 15
      - key: MAX_CLIP_SECONDS
        value: 90
      - key: DEFAULT_CLIP_SECONDS
        value: 35
      - key: CLEANUP_AFTER_MINUTES
        value: 120
      - key: RATE_LIMIT_WINDOW_MINUTES
        value: 15
      - key: RATE_LIMIT_MAX_REQUESTS
        value: 10
